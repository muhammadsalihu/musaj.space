<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMPB File Platform — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:#f7f8fa; color:#111827; min-height:100vh; }
  header { background:#fff; border-bottom:1px solid #e5e7eb; padding:14px 32px; display:flex; align-items:center; gap:18px; position:sticky; top:0; z-index:50; }
  header .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; }
  header .brand .logo { width:34px; height:34px; border-radius:9px; background:#2563eb; color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; }
  header .brand small { display:block; font-size:10px; font-weight:600; color:#9ca3af; letter-spacing:.12em; }
  .spacer { flex:1; }
  .demo { background:#fef9c3; border:1px solid #fde68a; color:#854d0e; font-size:11px; font-weight:600; padding:5px 12px; border-radius:99px; }
  select { font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 10px; border:1px solid #d1d5db; border-radius:8px; background:#fff; color:#111827; }
  nav { background:#fff; border-bottom:1px solid #e5e7eb; padding:0 32px; display:flex; gap:4px; position:sticky; top:63px; z-index:40; }
  nav button { font-family:inherit; font-size:13.5px; font-weight:600; color:#6b7280; background:none; border:none; padding:13px 16px; cursor:pointer; border-bottom:2.5px solid transparent; }
  nav button.active { color:#2563eb; border-bottom-color:#2563eb; }
  nav button:hover { color:#111827; }
  main { max-width:1180px; margin:0 auto; padding:28px 32px 80px; }
  h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .sub { font-size:13px; color:#6b7280; margin:4px 0 24px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:26px; }
  .stat { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:16px 18px; }
  .stat .v { font-size:26px; font-weight:800; }
  .stat .l { font-size:11px; font-weight:700; color:#6b7280; letter-spacing:.06em; text-transform:uppercase; margin-top:2px; }
  .stat.amber .v { color:#b45309; } .stat.red .v { color:#b91c1c; } .stat.blue .v { color:#2563eb; }
  .cols2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:900px){ .cols2{grid-template-columns:1fr;} }
  .panel { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:20px; }
  .panel h3 { font-size:14px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
  .btn { font-family:inherit; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:9px; border:1px solid #d1d5db; background:#fff; color:#111827; cursor:pointer; }
  .btn.primary { background:#2563eb; border-color:#2563eb; color:#fff; }
  .btn.primary:hover { background:#1d4ed8; }
  .btn.amber { background:#f59e0b; border-color:#f59e0b; color:#fff; }
  .btn.green { background:#059669; border-color:#059669; color:#fff; }
  .btn.red { background:#fff; color:#b91c1c; border-color:#fca5a5; }
  .btn.sm { padding:5px 10px; font-size:11.5px; border-radius:7px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; }
  th { font-size:10.5px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.07em; text-align:left; padding:8px 10px; border-bottom:1px solid #e5e7eb; }
  td { font-size:12.5px; padding:10px; border-bottom:1px solid #f3f4f6; vertical-align:middle; }
  tr.rowclick { cursor:pointer; } tr.rowclick:hover { background:#f9fafb; }
  .badge { display:inline-block; font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:99px; }
  .b-available { background:#ecfdf5; color:#047857; }
  .b-requested { background:#eff6ff; color:#1d4ed8; }
  .b-signed { background:#fef3c7; color:#a16207; }
  .b-on_loan { background:#fff7ed; color:#c2410c; }
  .b-pending { background:#eff6ff; color:#1d4ed8; }
  .b-fulfilled { background:#ecfdf5; color:#047857; }
  .b-rejected { background:#fef2f2; color:#b91c1c; }
  .late { color:#b45309; font-weight:700; }
  .ok { color:#047857; }
  .searchrow { display:flex; gap:10px; margin-bottom:16px; align-items:center; }
  .searchrow input { flex:1; max-width:380px; font-family:inherit; font-size:13px; padding:9px 14px; border:1px solid #d1d5db; border-radius:9px; }
  .tl { list-style:none; }
  .tl li { display:flex; gap:12px; padding:8px 0; border-bottom:1px dashed #f3f4f6; font-size:12px; }
  .tl .t { color:#9ca3af; width:118px; flex-shrink:0; font-size:11px; padding-top:1px; }
  .tl .act { font-weight:700; width:110px; flex-shrink:0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label { display:block; font-size:11px; font-weight:700; color:#374151; margin:12px 0 5px; }
  input.f, select.f, textarea.f { width:100%; font-family:inherit; font-size:13px; padding:9px 12px; border:1px solid #d1d5db; border-radius:9px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .hidden { display:none !important; }
  .modal { background:#fff; border-radius:16px; padding:24px; width:640px; max-width:94vw; max-height:88vh; overflow-y:auto; }
  .modal h2 { font-size:17px; font-weight:800; margin-bottom:4px; }
  .modal .msub { font-size:12px; color:#6b7280; margin-bottom:8px; }
  .mrow { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  canvas.sig { border:1.5px dashed #cbd5e1; border-radius:10px; background:#fff; touch-action:none; cursor:crosshair; display:block; }
  #toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; font-size:13px; font-weight:600; padding:11px 20px; border-radius:10px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
  .empty { text-align:center; color:#9ca3af; font-size:13px; padding:28px 0; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:6px 12px; font-size:12.5px; margin:14px 0; }
  .kv .k { color:#6b7280; font-weight:600; }
  .sigline { margin-top:12px; padding:10px 14px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:9px; font-size:11.5px; color:#6b7280; display:flex; align-items:center; gap:10px; }
  .sigline img { height:34px; }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">📁</div><div>NMPB File Platform<small>PROTOTYPE · MPB PROJECT 2</small></div></div>
  <div class="spacer"></div>
  <span class="demo">Demo mode — switch role &amp; office below</span>
  <select id="roleSel" title="Acting role"></select>
  <select id="officeSel" title="Your office"></select>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<div id="modal" class="modal-backdrop hidden"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= NMPB File Platform — standalone prototype =================
   Data entry · file tracking (check-in/out, dwell time) · request → director
   signature gate → release · search · movement audit log · reports.
   Storage: localStorage (demo). No backend, no external dependencies. */

const OFFICES = ['Registry','Dir. of Records','Directorate A','Directorate B','Directorate C'];
const DAY = 864e5;
const OVERDUE_DAYS = 3;
const KEY = 'nmpb_proto_v1';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '-' + Math.random().toString(36).slice(2,7).toUpperCase();
const fmt = ts => new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
function dwell(ts){ const ms = Date.now()-ts; const d = Math.floor(ms/DAY); if(d<1){ const h=Math.floor(ms/36e5); return h<1? Math.max(1,Math.floor(ms/6e4))+'m' : h+'h'; } return d+'d '+(d<7?Math.floor((ms%dDAY())/36e5)+'h':''); }
function dDAY(){ return DAY; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }

/* ---------- state ---------- */
function seed(){
  const n = Date.now();
  return {
    files: [
      {serviceNo:'N-2045', title:'Personnel File — Lt. A. Bello', category:'Personnel', origin:'Registry', current:'Directorate A', status:'on_loan', holder:'Lt. A. Bello', registered:n-9*DAY},
      {serviceNo:'N-0908', title:'Medical Board Report — Case 12', category:'Medical', origin:'Dir. of Records', current:'Directorate A', status:'on_loan', holder:'Cpl. I. Musa', registered:n-14*DAY},
      {serviceNo:'N-0312', title:'Equipment Requisition Q3', category:'Equipment', origin:'Registry', current:'Registry', status:'available', holder:null, registered:n-6*DAY},
      {serviceNo:'N-1187', title:'Promotion Board Minutes — Mar', category:'Minutes', origin:'Registry', current:'Registry', status:'available', holder:null, registered:n-4*DAY},
      {serviceNo:'N-0533', title:'Unit Movement Order 12', category:'Operations', origin:'Directorate A', current:'Directorate A', status:'available', holder:null, registered:n-30*DAY},
      {serviceNo:'N-1640', title:'Procurement File 2026', category:'Finance', origin:'Directorate B', current:'Directorate B', status:'available', holder:null, registered:n-21*DAY},
      {serviceNo:'N-0027', title:'Finance Audit Draft', category:'Finance', origin:'Directorate C', current:'Directorate C', status:'available', holder:null, registered:n-11*DAY},
      {serviceNo:'N-2761', title:'Disciplinary Case File 07', category:'Disciplinary', origin:'Dir. of Records', current:'Dir. of Records', status:'available', holder:null, registered:n-2*DAY},
    ],
    requests: [
      {id:'R-1001', serviceNo:'N-2761', requester:'Sgt. D. Okon', office:'Directorate A', purpose:'Case review hearing', status:'pending', at:n-5*36e5, approvedBy:null, signedAt:null, signature:null},
      {id:'R-1002', serviceNo:'N-0908', requester:'Cpl. I. Musa', office:'Directorate A', purpose:'Medical board follow-up', status:'fulfilled', at:n-11*DAY, approvedBy:'Col. M. Danjuma', signedAt:n-10*DAY, signature:null},
      {id:'R-1003', serviceNo:'N-2045', requester:'Lt. A. Bello', office:'Directorate A', purpose:'Records verification', status:'fulfilled', at:n-9*DAY, approvedBy:'Col. M. Danjuma', signedAt:n-9*DAY, signature:null},
    ],
    movements: [
      {at:n-9*DAY,          action:'Registered', serviceNo:'N-2045', from:'—', to:'Registry', by:'Registry Officer'},
      {at:n-9*DAY-2*36e5,   action:'Signed',     serviceNo:'N-2045', from:'—', to:'Director approval', by:'Col. M. Danjuma'},
      {at:n-9*DAY-4*36e5,   action:'Checked out',serviceNo:'N-2045', from:'Registry', to:'Directorate A', by:'Registry Officer'},
      {at:n-14*DAY,         action:'Registered', serviceNo:'N-0908', from:'—', to:'Dir. of Records', by:'Registry Officer'},
      {at:n-11*DAY,         action:'Requested',  serviceNo:'N-0908', from:'—', to:'by Cpl. I. Musa', by:'Cpl. I. Musa'},
      {at:n-10*DAY,         action:'Checked out',serviceNo:'N-0908', from:'Dir. of Records', to:'Directorate A', by:'Registry Officer'},
      {at:n-2*DAY,          action:'Registered', serviceNo:'N-2761', from:'—', to:'Dir. of Records', by:'Registry Officer'},
      {at:n-5*36e5,         action:'Requested',  serviceNo:'N-2761', from:'—', to:'by Sgt. D. Okon', by:'Sgt. D. Okon'},
    ],
  };
}
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); return s && s.files ? s : null; }catch(e){ return null; } }
let S = load() || seed();
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

/* ---------- session (demo) ---------- */
const ROLES = { registry:'Registry Officer', staff:'Staff Officer', director:'Director' };
let role = 'registry', office = 'Registry';
$('#roleSel').innerHTML = Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#officeSel').innerHTML = OFFICES.map(o=>`<option>${o}</option>`).join('');
$('#roleSel').onchange = e => { role=e.target.value; render(); };
$('#officeSel').onchange = e => { office=e.target.value; };

/* ---------- routing ---------- */
const TABS = [['dashboard','Dashboard'],['files','Files & Data Entry'],['requests','Requests & Signatures'],['movements','Movement Log'],['reports','Reports']];
let tab = 'dashboard';
$('#nav').innerHTML = TABS.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
$('#nav').onclick = e => { const b=e.target.closest('button'); if(!b) return; tab=b.dataset.t; render(); };
function openModal(html){ $('#modalBox').innerHTML=html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); render(); }
$('#modal').addEventListener('click', e => { if(e.target===$('#modal')) closeModal(); });

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.t===tab));
  ({dashboard:renderDash, files:renderFiles, requests:renderRequests, movements:renderLog, reports:renderReports})[tab]();
}

/* ---------- computed ---------- */
const fileBySn = sn => S.files.find(f=>f.serviceNo===sn);
const isOverdue = f => f.status==='on_loan' && S.movements.find(m=>m.serviceNo===f.serviceNo && m.action==='Checked out') && (Date.now() - S.movements.find(m=>m.serviceNo===f.serviceNo && m.action==='Checked out').at > OVERDUE_DAYS*DAY);
function lastOut(f){ return S.movements.find(m=>m.serviceNo===f.serviceNo && m.action==='Checked out'); }
function log(action, serviceNo, from, to, by){ S.movements.unshift({at:Date.now(), action, serviceNo, from, to, by: by||ROLES[role]}); }

/* ================= DASHBOARD ================= */
function renderDash(){
  const total=S.files.length, loan=S.files.filter(f=>f.status==='on_loan').length, req=S.requests.filter(r=>r.status==='pending').length;
  const over=S.files.filter(isOverdue);
  const recent=S.movements.slice(0,7);
  $('#app').innerHTML = `
    <h1>Dashboard</h1>
    <div class="sub">Live position of every file — where it is, who holds it, how long it has stayed.</div>
    <div class="stats">
      <div class="stat blue"><div class="v">${total}</div><div class="l">Files registered</div></div>
      <div class="stat"><div class="v">${loan}</div><div class="l">Out of home office</div></div>
      <div class="stat"><div class="v">${req}</div><div class="l">Pending approvals</div></div>
      <div class="stat ${over.length?'red':''}"><div class="v">${over.length}</div><div class="l">Overdue (>${OVERDUE_DAYS}d)</div></div>
    </div>
    <div class="cols2">
      <div class="panel"><h3>⚠ Overdue files</h3>${ over.length ? `<table><tr><th>File</th><th>Held at</th><th>Holder</th><th>Time held</th></tr>${over.map(f=>`
        <tr class="rowclick" onclick="openFile('${f.serviceNo}')"><td><b>${esc(f.serviceNo)}</b></td><td>${esc(f.current)}</td><td>${esc(f.holder||'—')}</td><td class="late">${dwell(lastOut(f).at)} ⚠</td></tr>`).join('')}</table>`
        : `<div class="empty">No overdue files 🎉</div>` }</div>
      <div class="panel"><h3>Recent activity</h3><ul class="tl">${recent.map(m=>`
        <li><span class="t">${fmt(m.at)}</span><span class="act">${esc(m.action)}</span><span><b>${esc(m.serviceNo)}</b> ${esc(m.from!=='—'?m.from+' → ':'' )}${esc(m.to)}</span></li>`).join('')}</ul></div>
    </div>`;
}

/* ================= FILES ================= */
let fileQuery='';
function statusBadge(s){ return `<span class="badge b-${esc(s)}">${esc({available:'Available',requested:'Requested',on_loan:'On loan'}[s]||s)}</span>`; }
function renderFiles(){
  const q=fileQuery.toLowerCase();
  const rows=S.files.filter(f=>!q || (f.serviceNo+' '+f.title+' '+f.current+' '+f.status+' '+f.category).toLowerCase().includes(q));
  $('#app').innerHTML = `
    <h1>Files &amp; Data Entry</h1>
    <div class="sub">Digital registry — replaces the Excel entry. Key lookup: <b>service number</b>.</div>
    <div class="searchrow">
      <input id="fq" placeholder="Search by service number, title, office, status…" value="${esc(fileQuery)}">
      ${role==='registry' ? `<button class="btn primary" onclick="openNewFile()">＋ Register new file</button>`:''}
    </div>
    <div class="panel"><table>
      <tr><th>Service No.</th><th>Title</th><th>Category</th><th>Current office</th><th>Status</th><th>Dwell</th></tr>
      ${rows.map(f=>{ const o=isOverdue(f); return `<tr class="rowclick" onclick="openFile('${f.serviceNo}')">
        <td><b>${esc(f.serviceNo)}</b></td><td>${esc(f.title)}</td><td>${esc(f.category)}</td>
        <td>${esc(f.current)}${f.holder?` <span style="color:#9ca3af;font-size:11px;">· ${esc(f.holder)}</span>`:''}</td>
        <td>${statusBadge(f.status)}</td>
        <td class="${o?'late':'ok'}">${o? dwell(lastOut(f).at)+' ⚠' : f.status==='on_loan'? dwell(lastOut(f).at) : 'in office'}</td></tr>`;}).join('')}
      ${rows.length?'':'<tr><td colspan="6"><div class="empty">No files match your search.</div></td></tr>'}
    </table></div>`;
  $('#fq').oninput = e => { fileQuery=e.target.value; renderFiles(); $('#fq').focus(); const v=$('#fq'); v.setSelectionRange(v.value.length,v.value.length); };
}
function openNewFile(){
  openModal(`<h2>Register new file</h2><div class="msub">Digital data entry — creates a structured record + first movement log entry.</div>
    <label>Service number *</label><input class="f" id="nf-sn" placeholder="e.g. N-4021">
    <label>Title *</label><input class="f" id="nf-title" placeholder="e.g. Personnel File — Sgt. J. Adamu">
    <label>Category</label><select class="f" id="nf-cat"><option>Personnel</option><option>Operations</option><option>Finance</option><option>Medical</option><option>Minutes</option><option>Equipment</option><option>Disciplinary</option></select>
    <label>Home office</label><select class="f" id="nf-office">${OFFICES.map(o=>`<option>${o}</option>`).join('')}</select>
    <div class="mrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addFile()">Register file</button></div>`);
}
function addFile(){
  const sn=$('#nf-sn').value.trim(), title=$('#nf-title').value.trim(), cat=$('#nf-cat').value, off=$('#nf-office').value;
  if(!sn||!title) return toast('Service number and title are required');
  if(fileBySn(sn)) return toast('A file with that service number already exists');
  S.files.push({serviceNo:sn,title,category:cat,origin:off,current:off,status:'available',holder:null,registered:Date.now()});
  log('Registered', sn, '—', off); save(); toast('File '+sn+' registered'); closeModal();
}

/* ---- file detail + actions ---- */
window.openFile = function(sn){
  const f=fileBySn(sn); if(!f) return;
  const tl=S.movements.filter(m=>m.serviceNo===sn);
  const pend=S.requests.find(r=>r.serviceNo===sn && ['pending','signed'].includes(r.status));
  const overdue=isOverdue(f);
  let actions='';
  if(f.status==='available') actions = `<button class="btn primary" onclick="openRequest('${sn}')">📝 Request this file</button>`;
  else if(f.status==='requested' && pend){
    if(role==='director' && pend.status==='pending') actions = `<button class="btn amber" onclick="openSign('${pend.id}')">✍️ Approve &amp; Sign</button>`;
    else actions = `<span class="badge b-${pend.status==='signed'?'signed':'pending'}">${pend.status==='signed'?'Awaiting release (signed)':'Awaiting Director approval'}</span>`;
  }
  else if(f.status==='on_loan'){
    if(role==='registry'||role==='staff') actions = `<button class="btn green" onclick="openCheckin('${sn}')">📥 Check in (return)</button>`;
  }
  openModal(`
    <h2>${esc(f.serviceNo)} — ${esc(f.title)}</h2>
    <div class="msub">${esc(f.category)} · registered ${fmtD(f.registered)}</div>
    <div class="kv">
      <span class="k">Status</span><span>${statusBadge(f.status)} ${overdue?` <b class="late">overdue ${dwell(lastOut(f).at)} ⚠</b>`:''}</span>
      <span class="k">Current office</span><span>${esc(f.current)}</span>
      <span class="k">Holder</span><span>${esc(f.holder||'—')}</span>
      <span class="k">Home office</span><span>${esc(f.origin)}</span>
    </div>
    ${pend?`<div class="sigline">📄 Active request <b>${pend.id}</b> — ${esc(pend.requester)} (${esc(pend.office)}) · “${esc(pend.purpose)}”${pend.signedAt?` · signed by <b>${esc(pend.approvedBy)}</b> ${fmt(pend.signedAt)}`:''}</div>`:''}
    ${actions?`<div style="margin:14px 0 4px;">${actions}</div>`:''}
    <h3 style="font-size:13px;margin-top:18px;">Movement history (automatic)</h3>
    <ul class="tl">${tl.map(m=>`<li><span class="t">${fmt(m.at)}</span><span class="act">${esc(m.action)}</span><span>${m.from!=='—'?esc(m.from)+' → ':''}${esc(m.to)} <span style="color:#9ca3af;">· ${esc(m.by)}</span></span></li>`).join('')||'<li><span>No movements yet.</span></li>'}</ul>
    <div class="mrow"><button class="btn" onclick="closeModal()">Close</button></div>`);
};

/* ---- request flow ---- */
window.openRequest = function(sn){
  const f=fileBySn(sn);
  openModal(`<h2>File request form</h2><div class="msub">Requesting <b>${esc(sn)}</b> — ${esc(f.title)}. A Director must review &amp; sign before release.</div>
    <label>Requester name *</label><input class="f" id="rq-name" value="${role==='staff'?'Officer name':'Officer name'}">
    <label>Receiving office</label><select class="f" id="rq-office">${OFFICES.map(o=>`<option ${o===office?'selected':''}>${o}</option>`).join('')}</select>
    <label>Purpose *</label><textarea class="f" id="rq-purpose" rows="2" placeholder="Why is this file needed?"></textarea>
    <div class="mrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitRequest('${sn}')">Submit request</button></div>`);
};
window.submitRequest = function(sn){
  const name=$('#rq-name').value.trim(), off=$('#rq-office').value, purpose=$('#rq-purpose').value.trim();
  if(!name||!purpose) return toast('Requester name and purpose are required');
  const r={id:uid('R'), serviceNo:sn, requester:name, office:off, purpose, status:'pending', at:Date.now(), approvedBy:null, signedAt:null, signature:null};
  S.requests.unshift(r); fileBySn(sn).status='requested';
  log('Requested', sn, '—', 'by '+name, name); save(); toast('Request '+r.id+' submitted — awaiting Director approval'); closeModal();
};

/* ---- signature gate ---- */
window.openSign = function(rid){
  const r=S.requests.find(x=>x.id===rid); const f=fileBySn(r.serviceNo);
  openModal(`<h2>Director approval — signature gate</h2>
    <div class="msub">Request <b>${esc(rid)}</b>: ${esc(f.serviceNo)} — ${esc(f.title)} · requested by ${esc(r.requester)} (${esc(r.office)}) · “${esc(r.purpose)}”</div>
    <div class="sigline" style="margin-top:14px;">⚠ No file is released until a Director signs here. The physical form stays — this mirrors it digitally.</div>
    <label>Director signature (draw below)</label>
    <canvas class="sig" id="sigpad" width="560" height="180"></canvas>
    <div class="mrow" style="justify-content:space-between;">
      <button class="btn red" onclick="rejectRequest('${rid}')">✕ Reject</button>
      <div><button class="btn" onclick="clearSig()">Clear</button>
      <button class="btn amber" id="signGo" onclick="signRequest('${rid}')">✍️ Sign &amp; Approve</button></div>
    </div>`);
  initSigPad();
};
let sigOK=false;
function initSigPad(){
  sigOK=false;
  const c=$('#sigpad'), ctx=c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.strokeStyle='#111827';
  let drawing=false, px=0, py=0;
  const pos=e=>{ const r=c.getBoundingClientRect(); return [ (e.clientX-r.left)*c.width/r.width, (e.clientY-r.top)*c.height/r.height ]; };
  const start=e=>{ drawing=true; [px,py]=pos(e); e.preventDefault(); };
  const move=e=>{ if(!drawing) return; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke(); px=x; py=y; sigOK=true; e.preventDefault(); };
  const end=()=>{ drawing=false; };
  c.onpointerdown=start; c.onpointermove=move; c.onpointerup=end; c.onpointerleave=end;
  window._clearSig = () => { ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); sigOK=false; };
}
window.clearSig = () => window._clearSig && window._clearSig();
window.signRequest = function(rid){
  if(!sigOK) return toast('Please draw the Director signature first');
  const data=$('#sigpad').toDataURL();
  const r=S.requests.find(x=>x.id===rid);
  r.status='signed'; r.approvedBy='Director — '+office; r.signedAt=Date.now(); r.signature=data;
  log('Signed', r.serviceNo, '—', 'Director approval', r.approvedBy); save();
  toast('Signed ✓ — file can now be checked out to '+r.office); closeModal();
};
window.rejectRequest = function(rid){
  const r=S.requests.find(x=>x.id===rid);
  r.status='rejected'; fileBySn(r.serviceNo).status='available';
  log('Request rejected', r.serviceNo, '—', 'by Director', ROLES[role]); save();
  toast('Request rejected — file returned to Available'); closeModal();
};

/* ---- check out / check in ---- */
window.openCheckin = function(sn){
  const f=fileBySn(sn);
  const opts=OFFICES.map(o=>`<option ${o===f.origin?'selected':''}>${o}</option>`).join('');
  openModal(`<h2>Check in — return file</h2><div class="msub">Returning <b>${esc(sn)}</b> from <b>${esc(f.current)}</b>. Dwell time at ${esc(f.current)} will be closed and minuted.</div>
    <label>Return to office</label><select class="f" id="ci-office">${opts}</select>
    <div class="mrow"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="checkin('${sn}')">📥 Confirm check-in</button></div>`);
};
window.checkin = function(sn){
  const f=fileBySn(sn), to=$('#ci-office').value;
  log('Checked in', sn, f.current, to); save();
  f.status='available'; f.holder=null; f.current=to;
  const r=S.requests.find(x=>x.serviceNo===sn && x.status==='signed'); if(r) r.status='returned';
  save(); toast('File '+sn+' checked in to '+to); closeModal();
};
window.checkout = function(rid){
  const r=S.requests.find(x=>x.id===rid), f=fileBySn(r.serviceNo);
  log('Checked out', f.serviceNo, f.current, r.office); save();
  f.status='on_loan'; f.current=r.office; f.holder=r.requester;
  r.status='fulfilled'; save();
  toast('File '+f.serviceNo+' checked out to '+r.office+' — dwell timer started'); closeModal();
};

/* ================= REQUESTS ================= */
function renderRequests(){
  const rows=S.requests;
  $('#app').innerHTML = `
    <h1>Requests &amp; Signatures</h1>
    <div class="sub">Request → Director signature gate → release. ${role==='director'?'You are viewing as <b>Director</b> — sign pending requests below.':''}</div>
    <div class="panel"><table>
      <tr><th>Request</th><th>File</th><th>Requester</th><th>Office</th><th>Purpose</th><th>Status</th><th></th></tr>
      ${rows.map(r=>`<tr>
        <td><b>${esc(r.id)}</b><div style="color:#9ca3af;font-size:10.5px;">${fmt(r.at)}</div></td>
        <td class="rowclick" onclick="openFile('${r.serviceNo}')"><b>${esc(r.serviceNo)}</b></td>
        <td>${esc(r.requester)}</td><td>${esc(r.office)}</td>
        <td style="max-width:180px;">${esc(r.purpose)}</td>
        <td><span class="badge b-${esc(r.status)}">${esc({pending:'Pending approval',signed:'Signed — awaiting release',fulfilled:'Checked out',returned:'Returned',rejected:'Rejected'}[r.status])}</span></td>
        <td>${ r.status==='pending' && role==='director' ? `<button class="btn sm amber" onclick="openSign('${r.id}')">✍️ Approve &amp; Sign</button>`
              : r.status==='signed' && (role==='registry'||role==='staff') ? `<button class="btn sm green" onclick="checkout('${r.id}')">🚚 Check out</button>` : '' }</td>
      </tr>`).join('')}
    </table></div>`;
}

/* ================= MOVEMENT LOG ================= */
function renderLog(){
  $('#app').innerHTML = `
    <h1>Movement Log</h1>
    <div class="sub">Immutable audit trail — every registration, request, signature, check-out and check-in, automatically.</div>
    <div class="panel"><table>
      <tr><th>When</th><th>Action</th><th>File</th><th>From</th><th>To</th><th>By</th></tr>
      ${S.movements.map(m=>`<tr>
        <td style="white-space:nowrap;">${fmt(m.at)}</td>
        <td><b>${esc(m.action)}</b></td>
        <td class="rowclick" onclick="openFile('${m.serviceNo}')"><b>${esc(m.serviceNo)}</b></td>
        <td>${esc(m.from)}</td><td>${esc(m.to)}</td><td>${esc(m.by)}</td></tr>`).join('')}
    </table></div>`;
}

/* ================= REPORTS ================= */
function renderReports(){
  const rows=OFFICES.map(o=>{
    const held=S.files.filter(f=>f.current===o);
    const over=held.filter(isOverdue);
    let longest=0;
    held.forEach(f=>{ if(f.status==='on_loan'){ const m=lastOut(f); if(m) longest=Math.max(longest, Date.now()-m.at); } });
    return {o, n:held.length, over:over.length, longest};
  });
  const week=S.movements.filter(m=>Date.now()-m.at<7*DAY).length;
  $('#app').innerHTML = `
    <h1>Reports</h1>
    <div class="sub">Movement summary per office — impossible to produce from scans or Excel alone.</div>
    <div class="stats">
      <div class="stat blue"><div class="v">${week}</div><div class="l">Movements last 7 days</div></div>
      <div class="stat"><div class="v">${S.requests.length}</div><div class="l">Requests total</div></div>
      <div class="stat"><div class="v">${S.files.filter(f=>f.status==='on_loan').length}</div><div class="l">Currently out</div></div>
    </div>
    <div class="panel"><h3>Office summary — files currently held</h3><table>
      <tr><th>Office</th><th>Files held</th><th>Overdue</th><th>Longest current hold</th></tr>
      ${rows.map(r=>`<tr><td><b>${esc(r.o)}</b></td><td>${r.n}</td>
        <td class="${r.over?'late':'ok'}">${r.over||'0'}</td>
        <td class="${r.longest>OVERDUE_DAYS*DAY?'late':'ok'}">${r.longest?dwell(Date.now()-r.longest):'—'}</td></tr>`).join('')}
    </table></div>`;
}

render();
</script>
